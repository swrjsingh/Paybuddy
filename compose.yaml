    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 512m

  ledger-reconciliation:
    build:
      context: .
      args:
        SERVICE: ledger-reconciliation
    image: paybuddy/ledger-reconciliation:0.1.0
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ledger_reconciliation
      DATABASE_USER: ledger_app
      DATABASE_PASSWORD: local-ledger-app
      MIGRATION_USER: ledger_reconciliation
      MIGRATION_PASSWORD: local-ledger_reconciliation
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      RABBIT_USER: ${RABBIT_USER:?}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 512m

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      gateway-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  rabbit-data:
