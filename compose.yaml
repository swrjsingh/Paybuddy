      context: .
      args:
        SERVICE: webhook-ingestion
    image: paybuddy/webhook-ingestion:0.1.0
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/webhook_ingestion
      DATABASE_USER: webhook_ingestion
      DATABASE_PASSWORD: local-webhook_ingestion
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?}
